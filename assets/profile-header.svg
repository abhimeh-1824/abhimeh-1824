  <text x="72" y="150" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700">Abhishek Mehra</text>
  <text x="76" y="193" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="21">Backend Engineering  ·  System Design  ·  Problem Solving</text>
  <rect x="76" y="225" width="210" height="36" rx="18" fill="#123b3c" stroke="#2dd4bf" stroke-opacity=".55"/>
  <circle cx="96" cy="243" r="5" fill="#2dd4bf"/>
  <text x="111" y="249" fill="#ccfbf1" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600">Building useful software</text>
  <g transform="translate(760 65)">
    <rect width="355" height="172" rx="14" fill="#0a101b" stroke="#334155" stroke-width="1.5"/>
    <path d="M0 40H355" stroke="#334155"/>
    <circle cx="22" cy="20" r="5" fill="#fb7185"/><circle cx="42" cy="20" r="5" fill="#fbbf24"/><circle cx="62" cy="20" r="5" fill="#34d399"/>
    <text x="24" y="75" fill="#64748b" font-family="monospace" font-size="14">01</text><text x="56" y="75" fill="#7dd3fc" font-family="monospace" font-size="16">const</text><text x="108" y="75" fill="#e2e8f0" font-family="monospace" font-size="16">engineer = {</text>
    <text x="42" y="105" fill="#64748b" font-family="monospace" font-size="14">02</text><text x="74" y="105" fill="#5eead4" font-family="monospace" font-size="15">build:</text><text x="139" y="105" fill="#fcd34d" font-family="monospace" font-size="15">'reliable apps'</text>
    <text x="42" y="135" fill="#64748b" font-family="monospace" font-size="14">03</text><text x="74" y="135" fill="#5eead4" font-family="monospace" font-size="15">improve:</text><text x="164" y="135" fill="#fcd34d" font-family="monospace" font-size="15">'every day'</text>
    <text x="24" y="160" fill="#7dd3fc" font-family="monospace" font-size="16">};</text>
  </g>
</svg>
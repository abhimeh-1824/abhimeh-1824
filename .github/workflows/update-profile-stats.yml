name: Generate self-hosted profile cards

on:
  push:
    branches:
      - main
    paths:
      - "README.md"
      - ".github/workflows/update-profile-stats.yml"
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate profile cards
        uses: seijikohara/profile-cards-action@v0.0.5
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: abhimeh-1824
          cards: overview,contributions,languages
          output-dir: assets
          themes: light,dark
          commit: true
